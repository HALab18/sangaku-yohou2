<!-- GitHub Pages は存在しないパスでこのファイルを返す。既定の英語404だと利用者が
     行き先を失うため、日本語の案内とトップへの導線だけを置く。
     リンクは絶対パス (/sangaku-yohou2/…) にすること: 404 は任意の深さのURLで
     表示されるので、相対パスだと階層によってリンク先がずれる。
     ★ theme.css / theme.js の src も同じ理由で絶対パスにすること。相対にすると
       深い URL で 404 になったときだけ配色が当たらない(浅い URL では気づけない)。 -->
<link rel="stylesheet" href="/sangaku-yohou2/theme.css?v=249">
<!-- 配色の切り替え(自動/ライト/ダーク)。既定は「自動」＝端末(OS)の設定に従う。
     ★ defer を付けず、theme.css の直後で **同期実行** すること。遅らせると
       明るい配色で一度描いてから暗転する(起動時の白い一瞬が戻る)。
     このページには切り替えのボタンは置かない(出口を示すのが役目のページなので)。
     端末に記憶された選択には theme.js がそのまま従う。 -->
<script src="/sangaku-yohou2/theme.js?v=249"></script>
<style>
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;

.card{max-width:520px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:28px 22px;text-align:center;box-shadow:0 2px 12px var(--shadow)}
/* 山マークは stroke/fill を currentColor にしてあるので、色はここだけで決まる */
svg{width:64px;height:44px;margin-bottom:6px;color:var(--mark)}
h1{margin:6px 0 10px;font-size:1.2em;color:var(--head)}
p{margin:10px 0;color:var(--head-2);text-align:left}
.btn{display:inline-block;margin-top:14px;padding:12px 28px;background:var(--btn);color:var(--on-night);

.btn:hover{background:var(--btn-d)}
.sub{margin-top:16px;font-size:.85em;color:var(--muted);text-align:center}
.sub a{color:var(--link)}
</style>
</head>
